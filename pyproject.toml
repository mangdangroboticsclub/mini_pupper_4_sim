[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mp4-sim"
version = "0.2.0"
description = "Mini Pupper v4 simulation foundation: robot models with measured data, servo models, simulation environments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
# Shared by both modes. Backend-specific packages (mjlab, MuJoCo Warp) and every
# version pin live in requirements/ and are installed by scripts/install/.
dependencies = [
    "numpy",
    "mujoco",
    "torch",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mp4_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored upstream code; kept diffable against its source.
extend-exclude = ["src/mp4_sim/actuators/bam"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
